# Sign Every Commit With Gitsign
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-122-lab-010-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-sigstore"
      description: "Installs Helm 3.22.1, the private Sigstore stack (scaffold chart 0.6.117), the workstation pod and its trust material, Gitea"
      type: "file"
      source: "bootstrap/01-install-sigstore.sh"
    - name: "ats-122-lab-010-01-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The workstation pod and its service accounts (namespace workstation)."
      type: "file"
      source: "manifests/lab-start.yaml"

testing:
  init:
    - name: "wait-for-sigstore"
      description: "Waits until Fulcio, Rekor and the trust material are ready"
      type: "file"
      source: "testing/wait-for-sigstore.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-git-config"
      description: "The repository /root/inventory-app signs every commit with gitsign against the private Fulcio and Rekor"
      type: "file"
      source: "validation/validate-git-config.sh"
    - name: "validate-branch-signed"
      description: "Every commit on feature/signed after main verifies with gitsign as the developer service account, and there are at least two"
      type: "file"
      source: "validation/validate-branch-signed.sh"

teardown:
  keepCluster: false
