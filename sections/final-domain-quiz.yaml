# Final domain knowledge check across all three sections.
schema_version: 1
kind: question_bank
id: ats122-final
course_id: ATS122
exam_code: SIGSTORE
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: domain
  id: developer-tooling
  title: "Developer Tooling: Gitsign & Language Clients"
questions:
  - id: ats122-final-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Name what each keyless signing component does"
    source_readings:
      - sections/section-010/module-01/course-01-how-gitsign-signs-a-commit.md
    prompt: "Which component issues the short-lived certificate for gitsign's new public key?"
    options:
      - id: a
        text: "Rekor"
        explanation: "Not correct. Rekor records the signing in a log. It issues no certificate."
      - id: b
        text: "The OIDC provider"
        explanation: "Not correct. The provider only issues the identity token."
      - id: c
        text: "Fulcio"
        explanation: "Correct. Fulcio checks the identity token and issues the X.509 certificate."
      - id: d
        text: "Git"
        explanation: "Not correct. Git calls the signing program and stores the result."
    correct_option: c
    explanation: "Correct. Fulcio checks the identity token and issues the X.509 certificate."

  - id: ats122-final-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain what Git's own verification checks"
    source_readings:
      - sections/section-010/module-01/course-03-verifying-signed-commits.md
    prompt: "What does `git verify-commit` prove about a gitsign commit?"
    options:
      - id: a
        text: "That the expected service account signed it."
        explanation: "Not correct. Git does not know the expected identity."
      - id: b
        text: "That the author line matches the certificate."
        explanation: "Not correct. That needs `gitsign.matchCommitter`, and it never matches service accounts."
      - id: c
        text: "That the commit was pushed to the hosting service."
        explanation: "Not correct. The command does not look at any remote."
      - id: d
        text: "That some accepted identity signed it and that the signing is in Rekor, but not who signed it."
        explanation: "Correct. Git passes no expected identity to gitsign."
    correct_option: d
    explanation: "Correct. Git passes no expected identity to gitsign."

  - id: ats122-final-q03
    type: single_choice
    difficulty: advanced
    learning_objective: "Repair the signatures of a branch"
    source_readings:
      - sections/section-010/module-01/course-03-verifying-signed-commits.md
    prompt: "A branch has four commits. One is unsigned and one is signed by another identity. How do you fix it and keep the messages and files?"
    options:
      - id: a
        text: "Re-sign the series with `git rebase --force-rebase --gpg-sign <base>`, then force-push the branch."
        explanation: "Correct. The content stays the same and every commit gets a new signature from the right identity."
      - id: b
        text: "Run `gitsign verify` on each commit until it passes."
        explanation: "Not correct. Verifying changes nothing in the commits."
      - id: c
        text: "Set `gitsign.matchCommitter` to `true`."
        explanation: "Not correct. That only adds a check and never matches service account identities."
      - id: d
        text: "Create four new commits with new messages on top of the branch."
        explanation: "Not correct. The old commits would stay unsigned or wrongly signed."
    correct_option: a
    explanation: "Correct. The content stays the same and every commit gets a new signature from the right identity."

  - id: ats122-final-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain how expired certificates are checked"
    source_readings:
      - sections/section-020/module-01/course-01-what-a-verifier-checks.md
    prompt: "Fulcio certificates expire minutes after signing. Against which time does a verifier check the certificate?"
    options:
      - id: a
        text: "The time Rekor recorded the signing."
        explanation: "Correct. The integrated time of the log entry is the signing time."
      - id: b
        text: "The time of the verification."
        explanation: "Not correct. The certificate would always look expired."
      - id: c
        text: "The time in the file's modification date."
        explanation: "Not correct. A verifier does not trust file dates."
      - id: d
        text: "The time the trusted root was created."
        explanation: "Not correct. That date says nothing about the signing."
    correct_option: a
    explanation: "Correct. The integrated time of the log entry is the signing time."

  - id: ats122-final-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name the risk of the unsafe identity option"
    source_readings:
      - sections/section-020/module-01/course-02-writing-a-verifier-with-sigstore-go.md
    prompt: "What does `verify.WithoutIdentitiesUnsafe()` do?"
    options:
      - id: a
        text: "It skips the digest check of the file."
        explanation: "Not correct. The artifact is checked by `verify.WithArtifact`."
      - id: b
        text: "It checks the identity against a regular expression."
        explanation: "Not correct. Regular expressions go into `NewShortCertificateIdentity`."
      - id: c
        text: "It disables the transparency log check."
        explanation: "Not correct. The log is set with `WithTransparencyLog`."
      - id: d
        text: "It skips the identity check, so any signer with a valid certificate is accepted."
        explanation: "Correct. It is only for inspecting a bundle, never for a decision."
    correct_option: d
    explanation: "Correct. It is only for inspecting a bundle, never for a decision."

  - id: ats122-final-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Set the verifier thresholds"
    source_readings:
      - sections/section-020/module-01/course-02-writing-a-verifier-with-sigstore-go.md
    prompt: "What does `verify.WithTransparencyLog(1)` require?"
    options:
      - id: a
        text: "One entry in a transparency log that is in the trusted root."
        explanation: "Correct. It is a threshold on the log evidence."
      - id: b
        text: "One signed certificate timestamp from a CT log."
        explanation: "Not correct. That is `WithSignedCertificateTimestamps(1)`."
      - id: c
        text: "One timestamp authority response."
        explanation: "Not correct. `WithObserverTimestamps(1)` accepts a trusted time from a log entry or an authority."
      - id: d
        text: "One signer identity in the policy."
        explanation: "Not correct. The identity is part of the policy."
    correct_option: a
    explanation: "Correct. It is a threshold on the log evidence."

  - id: ats122-final-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Check the token audience"
    source_readings:
      - sections/section-030/module-01/course-01-the-sigstore-python-command-line.md
    prompt: "Which `aud` claim must the identity token have here?"
    options:
      - id: a
        text: "`kubernetes`"
        explanation: "Not correct. That is not the audience Fulcio accepts here."
      - id: b
        text: "`sigstore`"
        explanation: "Correct. sigstore-python and Fulcio both check it."
      - id: c
        text: "The cluster issuer URL."
        explanation: "Not correct. The issuer is the `iss` claim."
      - id: d
        text: "The name of the service account."
        explanation: "Not correct. The service account is in the `sub` claim."
    correct_option: b
    explanation: "Correct. sigstore-python and Fulcio both check it."

  - id: ats122-final-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read a failed identity check"
    source_readings:
      - sections/section-030/module-01/course-01-the-sigstore-python-command-line.md
    prompt: "A file signed by `ci-bot` is verified with the identity of `developer`. What happens?"
    options:
      - id: a
        text: "It passes, because the signature is valid."
        explanation: "Not correct. The identity check refuses it."
      - id: b
        text: "It fails because the signature is broken."
        explanation: "Not correct. The signature itself is fine."
      - id: c
        text: "It passes after a warning from Rekor."
        explanation: "Not correct. Rekor gives no warnings for this."
      - id: d
        text: "It fails. The signature is valid, but the certificate names a different signer."
        explanation: "Correct. A valid signature from the wrong signer is still refused."
    correct_option: d
    explanation: "Correct. A valid signature from the wrong signer is still refused."

  - id: ats122-final-q09
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain why clients interoperate"
    source_readings:
      - sections/section-030/module-01/course-04-other-language-clients.md
    prompt: "Why does a bundle written by sigstore-python verify with sigstore-go or cosign?"
    options:
      - id: a
        text: "They all share the same source code."
        explanation: "Not correct. Each client is its own library."
      - id: b
        text: "Every client has the same features and maturity."
        explanation: "Not correct. Their features move at different speeds."
      - id: c
        text: "All clients share the Sigstore bundle format and the trusted root and signing configuration documents."
        explanation: "Correct. The shared data makes them interchangeable, as long as they trust the same Fulcio and logs."
      - id: d
        text: "They all call the Python client in the background."
        explanation: "Not correct. Each client verifies by itself."
    correct_option: c
    explanation: "Correct. The shared data makes them interchangeable, as long as they trust the same Fulcio and logs."

  - id: ats122-final-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose a token provider for a pipeline"
    source_readings:
      - sections/section-010/module-02/course-01-identity-token-providers.md
    prompt: "A pod has its service account token mounted as a file. Which gitsign token provider reads it?"
    options:
      - id: a
        text: "`interactive`"
        explanation: "Not correct. That opens a browser."
      - id: b
        text: "`filesystem`"
        explanation: "Correct. It reads the mounted token file."
      - id: c
        text: "`envvar`"
        explanation: "Not correct. It reads an environment variable."
      - id: d
        text: "`github-actions`"
        explanation: "Not correct. It asks GitHub for a token."
    correct_option: b
    explanation: "Correct. The `filesystem` provider reads the mounted file."

  - id: ats122-final-q11
    type: single_choice
    difficulty: intermediate
    learning_objective: "Verify a signed tag"
    source_readings:
      - sections/section-010/module-02/course-02-signing-and-verifying-tags.md
    prompt: "Which command checks the signer of a release tag?"
    options:
      - id: a
        text: "`git verify-tag`"
        explanation: "Not correct. It does not check the signer identity."
      - id: b
        text: "`gitsign verify-tag` with `--certificate-identity` and `--certificate-oidc-issuer`"
        explanation: "Correct. It checks signature, proof and identity."
      - id: c
        text: "`git log --show-signature`"
        explanation: "Not correct. It does not check the identity."
      - id: d
        text: "`gitsign verify HEAD`"
        explanation: "Not correct. That checks a commit."
    correct_option: b
    explanation: "Correct. `gitsign verify-tag` with the identity options checks the signer."

  - id: ats122-final-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Anchor an identity pattern"
    source_readings:
      - sections/section-020/module-02/course-01-matching-signers-with-regular-expressions.md
    prompt: "Why anchor an identity pattern with `^` and `$`?"
    options:
      - id: a
        text: "Without anchors it matches inside a longer identity."
        explanation: "Correct. Another signer can then pass."
      - id: b
        text: "It makes the issuer optional."
        explanation: "Not correct. The issuer is separate."
      - id: c
        text: "It is needed to compile."
        explanation: "Not correct. It compiles without anchors."
      - id: d
        text: "It speeds up verification."
        explanation: "Not correct. Speed is not the reason."
    correct_option: a
    explanation: "Correct. Anchors stop partial matches."

  - id: ats122-final-q13
    type: single_choice
    difficulty: advanced
    learning_objective: "Trust a digest only from a safe place"
    source_readings:
      - sections/section-020/module-02/course-04-artifact-policies.md
    prompt: "Where should the expected digest of a release file come from?"
    options:
      - id: a
        text: "A file next to the artifact."
        explanation: "Not correct. An attacker can change both."
      - id: b
        text: "A source the attacker cannot change."
        explanation: "Correct. Then a changed file no longer matches."
      - id: c
        text: "The bundle only."
        explanation: "Not correct. Then the file is not checked."
      - id: d
        text: "The file name."
        explanation: "Not correct. A name carries no digest."
    correct_option: b
    explanation: "Correct. The digest must come from an unreachable source."

  - id: ats122-final-q14
    type: single_choice
    difficulty: intermediate
    learning_objective: "Allow two signers in Python"
    source_readings:
      - sections/section-030/module-02/course-01-policies-for-more-than-one-signer.md
    prompt: "Which sigstore-python policy accepts either of two signers?"
    options:
      - id: a
        text: "`AllOf` with two identities"
        explanation: "Not correct. Both would have to sign."
      - id: b
        text: "`AnyOf` with two identities"
        explanation: "Correct. One match is enough."
      - id: c
        text: "`UnsafeNoOp`"
        explanation: "Not correct. It accepts any signer."
      - id: d
        text: "A single `Identity`"
        explanation: "Not correct. It accepts one signer."
    correct_option: b
    explanation: "Correct. `AnyOf` accepts when one policy matches."

  - id: ats122-final-q15
    type: single_choice
    difficulty: advanced
    learning_objective: "Return the right exit code"
    source_readings:
      - sections/section-030/module-02/course-03-errors-and-exit-codes-in-automation.md
    prompt: "A release check always ends with `return 0`. What happens?"
    options:
      - id: a
        text: "The pipeline stops at the first bad file."
        explanation: "Not correct. The code is always zero."
      - id: b
        text: "The pipeline passes even when files failed."
        explanation: "Correct. A fixed zero hides failures."
      - id: c
        text: "The pipeline shows a warning."
        explanation: "Not correct. A pipeline reads the code."
      - id: d
        text: "The check reports every failure and fails."
        explanation: "Not correct. It reports nothing through the code."
    correct_option: b
    explanation: "Correct. The check must return the failure count."

  - id: ats122-final-q16
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name the identity of a workflow"
    source_readings:
      - sections/section-030/module-03/course-01-the-github-actions-certificate.md
    prompt: "Which value identifies a GitHub Actions workflow in a Fulcio certificate?"
    options:
      - id: a
        text: "The email address of the committer"
        explanation: "Not correct. The subject alternative name is built from the job workflow reference: the repository, the workflow path and the Git reference."
      - id: b
        text: "The workflow file with its Git reference, for example .../.github/workflows/release.yml@refs/tags/v1.0.0"
        explanation: "Correct. The subject alternative name is built from the job workflow reference: the repository, the workflow path and the Git reference."
      - id: c
        text: "The name of the runner"
        explanation: "Not correct. The subject alternative name is built from the job workflow reference: the repository, the workflow path and the Git reference."
      - id: d
        text: "The size of the repository"
        explanation: "Not correct. The subject alternative name is built from the job workflow reference: the repository, the workflow path and the Git reference."
    correct_option: b
    explanation: "Correct. The subject alternative name is built from the job workflow reference: the repository, the workflow path and the Git reference."

  - id: ats122-final-q17
    type: single_choice
    difficulty: advanced
    learning_objective: "Combine signers in a policy"
    source_readings:
      - sections/section-030/module-03/course-02-writing-a-workflow-policy.md
    prompt: "A release may be signed by a GitHub workflow or by ci-bot. Which sigstore-python policy accepts a file signed by either?"
    options:
      - id: a
        text: "AllOf of two Identity policies"
        explanation: "Not correct. AnyOf accepts when one policy accepts. AllOf needs both signers on the same file."
      - id: b
        text: "AnyOf of two Identity policies"
        explanation: "Correct. AnyOf accepts when one policy accepts. AllOf needs both signers on the same file."
      - id: c
        text: "UnsafeNoOp"
        explanation: "Not correct. AnyOf accepts when one policy accepts. AllOf needs both signers on the same file."
      - id: d
        text: "A single Identity with the repository name"
        explanation: "Not correct. AnyOf accepts when one policy accepts. AllOf needs both signers on the same file."
    correct_option: b
    explanation: "Correct. AnyOf accepts when one policy accepts. AllOf needs both signers on the same file."

  - id: ats122-final-q18
    type: single_choice
    difficulty: advanced
    learning_objective: "Write a safe identity pattern"
    source_readings:
      - sections/section-030/module-03/course-03-pinning-workflows-and-references.md
    prompt: "Why must a regular expression for a certificate identity start with ^ and end with $?"
    options:
      - id: a
        text: "Because Fulcio requires it"
        explanation: "Not correct. An unanchored pattern such as ci-bot matches any identity that contains those letters."
      - id: b
        text: "Because without anchors it matches inside a longer identity that nobody reviewed"
        explanation: "Correct. An unanchored pattern such as ci-bot matches any identity that contains those letters."
      - id: c
        text: "Because cosign ignores patterns without them"
        explanation: "Not correct. An unanchored pattern such as ci-bot matches any identity that contains those letters."
      - id: d
        text: "Because the dots would be escaped otherwise"
        explanation: "Not correct. An unanchored pattern such as ci-bot matches any identity that contains those letters."
    correct_option: b
    explanation: "Correct. An unanchored pattern such as ci-bot matches any identity that contains those letters."
