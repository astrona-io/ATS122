# Repair A Python Release Signing Step
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-122-capstone-030"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-sigstore"
      description: "Installs Helm 3.22.1, the private Sigstore stack (scaffold chart 0.6.117), the workstation pod and its trust material, py-runner"
      type: "file"
      source: "bootstrap/01-install-sigstore.sh"
    - name: "ats-122-capstone-030-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The workstation pod and its service accounts (namespace workstation)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-sigstore"
      description: "Waits until Fulcio, Rekor and the trust material are ready"
      type: "file"
      source: "testing/wait-for-sigstore.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-token-audience"
      description: "The token of py-runner has the audience sigstore"
      type: "file"
      source: "validation/validate-token-audience.sh"
    - name: "validate-release-signed"
      description: "Sign_release.py signs every file in /work/release so that cosign verifies it as the ci-bot service account"
      type: "file"
      source: "validation/validate-release-signed.sh"
    - name: "validate-verify-release"
      description: "Verify_release.py passes the signed folder and fails it after one file changes"
      type: "file"
      source: "validation/validate-verify-release.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - python:3.13.17-slim
