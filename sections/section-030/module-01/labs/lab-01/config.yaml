# Sign And Verify A Build Output From Python
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-122-lab-030-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-sigstore"
      description: "Installs Helm 3.22.1, the private Sigstore stack (scaffold chart 0.6.117), the workstation pod and its trust material, py-runner"
      type: "file"
      source: "bootstrap/01-install-sigstore.sh"
    - name: "ats-122-lab-030-01-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The workstation pod and its service accounts (namespace workstation)."
      type: "file"
      source: "manifests/lab-start.yaml"

testing:
  init:
    - name: "wait-for-sigstore"
      description: "Waits until Fulcio, Rekor and the trust material are ready"
      type: "file"
      source: "testing/wait-for-sigstore.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-sign-script"
      description: "/work/sign.py writes a bundle for app.tar.gz that cosign verifies as the ci-bot service account"
      type: "file"
      source: "validation/validate-sign-script.sh"
    - name: "validate-verify-accepts"
      description: "/work/verify.py accepts app.tar.gz with its bundle"
      type: "file"
      source: "validation/validate-verify-accepts.sh"
    - name: "validate-verify-rejects"
      description: "/work/verify.py refuses a changed file and a file signed by another identity"
      type: "file"
      source: "validation/validate-verify-rejects.sh"

teardown:
  keepCluster: false
