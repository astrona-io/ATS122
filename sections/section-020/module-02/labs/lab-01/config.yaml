# Accept Two Signers With A Pattern
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-122-lab-020-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-sigstore"
      description: "Installs Helm 3.22.1, the private Sigstore stack (scaffold chart 0.6.117), the workstation pod and its trust material, go-runner"
      type: "file"
      source: "bootstrap/01-install-sigstore.sh"
    - name: "ats-122-lab-020-02-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The workstation pod and its service accounts (namespace workstation)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-sigstore"
      description: "Waits until Fulcio, Rekor and the trust material are ready"
      type: "file"
      source: "testing/wait-for-sigstore.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-builds"
      description: "The program in /work/verify-blob builds"
      type: "file"
      source: "validation/validate-builds.sh"
    - name: "validate-accepts-both"
      description: "The verifier accepts the files of the developer and of ci-bot for the pattern"
      type: "file"
      source: "validation/validate-accepts-both.sh"
    - name: "validate-rejects-intruder"
      description: "The verifier refuses other.txt, which the intruder service account signed"
      type: "file"
      source: "validation/validate-rejects-intruder.sh"
    - name: "validate-rejects-tampered"
      description: "The verifier refuses a file that changed after it was signed"
      type: "file"
      source: "validation/validate-rejects-tampered.sh"
    - name: "validate-pattern-is-used"
      description: "A pattern that names only ci-bot accepts the CI file and refuses the developer's file"
      type: "file"
      source: "validation/validate-pattern-is-used.sh"
    - name: "validate-requires-pattern"
      description: "The verifier refuses to run when no pattern is given"
      type: "file"
      source: "validation/validate-requires-pattern.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - golang:1.25.14-alpine
